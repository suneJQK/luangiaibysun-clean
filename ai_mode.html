<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV AI · Chọn chế độ AI</title>
<style>
body{margin:0;background:#080c14;color:#f4f7ff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:0 auto;padding:24px}.card{background:#111a2b;border:1px solid #30435f;border-radius:16px;padding:22px}.muted{color:#93a0b6}label{display:block;margin:16px 0 7px;color:#c8d2e4}select,button{width:100%;padding:12px 13px;border-radius:10px;font:inherit}select{background:#09111e;color:#f4f7ff;border:1px solid #3b506f}button{margin-top:14px;border:0;background:#ead084;color:#17120a;font-weight:800;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:10px;background:#09111e;border:1px solid #30435f}.mode{margin-top:16px;padding:12px;border:1px solid #30435f;border-radius:10px;background:#0b1422}.mode b{color:#f4d996}
</style>
</head>
<body><main class="wrap"><div class="card"><h1>Chế độ AI</h1><p class="muted">Chọn chế độ cho phần luận giải. Chế độ được lưu trên trình duyệt bằng cookie và áp dụng cho các lần luận giải tiếp theo.</p><label for="mode">Chế độ sử dụng</label><select id="mode"></select><button id="save">Lưu chế độ</button><div id="status" class="status">Đang tải…</div><div id="desc" class="mode"></div></div></main>
<script>
const mode=$('mode');const status=$('status');const desc=$('desc');function $(id){return document.getElementById(id)}
function setCookie(name,value){document.cookie=`${name}=${encodeURIComponent(value)}; Path=/; Max-Age=31536000; SameSite=Lax`}
function getCookie(name){const p=document.cookie.split('; ').find(x=>x.startsWith(name+'='));return p?decodeURIComponent(p.split('=').slice(1).join('=')):''}
let modes=[];
async function load(){try{const r=await fetch('/api/ai-modes');const d=await r.json();modes=d.modes||[];mode.innerHTML=modes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');const current=getCookie('tv_ai_mode')||'standard';if(modes.some(x=>x.id===current))mode.value=current;render();status.textContent=`Đang dùng: ${modes.find(x=>x.id===mode.value)?.name||mode.value}`}catch(e){status.textContent='Không tải được danh sách chế độ AI'}}
function render(){const x=modes.find(m=>m.id===mode.value);desc.innerHTML=x?`<b>${x.name}</b><div class="muted">File cấu hình: ${x.file}</div>`:''}
mode.addEventListener('change',render);$('save').addEventListener('click',()=>{setCookie('tv_ai_mode',mode.value);const x=modes.find(m=>m.id===mode.value);status.textContent=`Đã chọn: ${x?.name||mode.value}`});load();
</script></body></html>
