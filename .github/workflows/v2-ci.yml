name: V2 CI

on:
  push:
    branches: [main, update/v2-engine, fix/cach-cuc-51-rules-20260820]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate rule catalog
        run: python - <<'PY'
import json
p=json.load(open('data/cach_cuc.json', encoding='utf-8'))
assert len(p) == 51
assert [x['id'] for x in p] == list(range(1, 52))
json.load(open('data/cach_cuc_overrides.json', encoding='utf-8'))
json.load(open('data/cach_cuc_modifiers.json', encoding='utf-8'))
json.load(open('data/cach_cuc_audit.json', encoding='utf-8'))
PY
      - name: Export star catalog
        run: python scripts/export_star_catalog.py
      - name: Validate star catalog
        run: python - <<'PY'
import json
p=json.load(open('data/stars.json', encoding='utf-8'))
assert p['count'] >= 100
assert len(p['stars']) == p['count']
PY
      - name: Run tests
        run: pytest -q
      - name: Workflow trigger check
        run: echo "V2 CI triggered successfully for $GITHUB_SHA"
