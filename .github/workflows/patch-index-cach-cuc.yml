name: Patch index Cach Cuc
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: remove temporary index patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_title = '<h3>Modifier phá / giảm</h3>'
          new_title = '<h3>Cách Cục Phá/Giảm</h3>'
          if old_title not in text:
              raise SystemExit('title pattern not found')
          text = text.replace(old_title, new_title, 1)
          old = "function renderCach(){const a=chart?.cach_cuc_analysis?.matched||[],m=chart?.cach_cuc_analysis?.modifiers||[];$('cachList').innerHTML=a.length?a.map(x=>`<div class=\"cach\"><h4>${esc(x.name)}</h4><div>${esc(x.category||'')}</div><p>${esc(x.description||x.reason||'')}</p></div>`).join(''):'<div class=\"msg\">Chưa có Cách Cục match.</div>';$('modList').innerHTML=m.length?m.map(x=>`<div class=\"cach\"><h4>${esc(x.name||'Modifier')}</h4><p>${esc(x.reason||x.description||'')}</p></div>`).join(''):'<div class=\"msg\">Không có modifier phá/giảm.</div>'}"
          new = """function renderCach(){
  const matched=Array.isArray(chart?.cach_cuc_analysis?.matched)?chart.cach_cuc_analysis.matched:[];
  const locPhungXungPha=matched.find(x=>normalize(x?.name)===normalize('Lộc Phùng Xung Phá'));
  $('cachList').innerHTML=matched.length?matched.map(x=>`<div class=\"cach\"><h4>${esc(x.name)}</h4><div>${esc(x.category||'')}</div><p>${esc(x.description||x.reason||'')}</p></div>`).join(''):'<div class=\"msg\">Chưa có Cách Cục match.</div>';
  $('modList').innerHTML=locPhungXungPha?`<div class=\"cach\"><h4>Lộc Phùng Xung Phá</h4><p>${esc(locPhungXungPha.description||locPhungXungPha.reason||'Cách Cục phá đã được xác định.')}</p></div>`:'<div class=\"msg\">Không có</div>';
}"""
          if old not in text:
              raise SystemExit('renderCach pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: render Cach Cuc Pha Giam correctly'
          git push
