name: Apply chat UI changes

on:
  push:
    paths:
      - automation/chat-ui.flag

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.bubble-head{font-size:11px;font-weight:800;color:#aebbd0;margin-bottom:5px}.question{min-height:96px;resize:vertical;margin-top:10px}'
          new_css = old_css + '.typing-bubble{display:flex;align-items:center;gap:9px;color:#aebbd0}.typing-spinner{width:14px;height:14px;border:2px solid #53637d;border-top-color:#ead084;border-radius:50%;animation:tv-spin .8s linear infinite;flex:0 0 auto}@keyframes tv-spin{to{transform:rotate(360deg)}}.typing-dots{display:inline-flex;gap:3px;align-items:center}.typing-dots span{width:5px;height:5px;border-radius:50%;background:#ead084;animation:tv-dot 1.2s infinite ease-in-out}.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}@keyframes tv-dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}.question-hint{font-size:11px;color:#74849d;margin-top:4px}'
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_placeholder = 'Ví dụ: Luận Mệnh, công danh, tài lộc và các Cách Cục... (Ctrl + Enter để gửi)'
          new_placeholder = 'Nhập câu hỏi và nhấn Enter để gửi. Shift + Enter để xuống dòng.'
          if old_placeholder not in s:
              raise SystemExit('placeholder anchor not found')
          s = s.replace(old_placeholder, new_placeholder, 1)

          old_actions = '<div class="chat-actions"><span class="chat-hint">Nội dung luận giải nằm trong khung cuộn riêng.</span><button id="askBtn" class="btn" onclick="askAI()">🤖 LUẬN GIẢI</button></div>'
          new_actions = '<div class="chat-actions"><span class="chat-hint">Nhấn Enter để gửi · Shift + Enter để xuống dòng.</span><button id="askBtn" class="btn" onclick="askAI()">🤖 LUẬN GIẢI</button></div>'
          if old_actions not in s:
              raise SystemExit('chat actions anchor not found')
          s = s.replace(old_actions, new_actions, 1)

          old_ask_start = "async function askAI(){if(!chart)return;const q=$('question').value.trim();if(!q)return;addBubble('user',q);$('question').value='';$('askBtn').disabled=true;try{const d=await call('/api/luan-giai',{method:'POST',body:JSON.stringify({ngay:+$('day').value,thang:+$('month').value,nam:+$('year').value,gio_sinh:$('hour').value,gioi_tinh:$('gender').value,ten:$('name').value,duong_lich:$('calendar').value==='true',time_zone:+$('tz').value,question:q,year:new Date().getFullYear()})});addBubble('assistant',d.answer||'Chưa cấu hình AI API key')}catch(e){addBubble('assistant','⚠️ '+e.message)}finally{$('askBtn').disabled=false}}"
          new_ask = "function showTyping(){removeTyping();const d=document.createElement('div');d.id='typingBubble';d.className='bubble a';d.innerHTML='<div class=\"bubble-head\">🤖 AI Tử Vi</div><div class=\"typing-bubble\"><span class=\"typing-spinner\"></span><span>AI đang trả lời</span><span class=\"typing-dots\"><span></span><span></span><span></span></span></div>';$('chatbox').appendChild(d);$('chatbox').scrollTop=$('chatbox').scrollHeight}function removeTyping(){const d=$('typingBubble');if(d)d.remove()}async function askAI(){if(!chart)return;const q=$('question').value.trim();if(!q)return;addBubble('user',q);$('question').value='';$('askBtn').disabled=true;showTyping();try{const d=await call('/api/luan-giai',{method:'POST',body:JSON.stringify({ngay:+$('day').value,thang:+$('month').value,nam:+$('year').value,gio_sinh:$('hour').value,gioi_tinh:$('gender').value,ten:$('name').value,duong_lich:$('calendar').value==='true',time_zone:+$('tz').value,question:q,year:new Date().getFullYear()})});removeTyping();addBubble('assistant',d.answer||'Chưa cấu hình AI API key')}catch(e){removeTyping();addBubble('assistant','⚠️ '+e.message)}finally{$('askBtn').disabled=false}}"
          if old_ask_start not in s:
              raise SystemExit('askAI anchor not found')
          s = s.replace(old_ask_start, new_ask, 1)

          old_keydown = "$('question').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();askAI()}});"
          new_keydown = "$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();askAI()}});"
          if old_keydown not in s:
              raise SystemExit('keydown anchor not found')
          s = s.replace(old_keydown, new_keydown, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove trigger flag and commit
        run: |
          rm -f automation/chat-ui.flag
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html automation/chat-ui.flag
          git commit -m 'feat: add chat typing animation and Enter-to-send' || exit 0
          git push
