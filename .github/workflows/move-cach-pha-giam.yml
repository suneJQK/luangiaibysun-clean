name: Move Cach Cuc Pha Giam

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/move-cach-pha-giam.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: move-cach-pha-giam
  cancel-in-progress: true

jobs:
  patch:
    if: github.event_name != 'push' || github.event.head_commit.message != 'fix: display all Cach Cuc without good bad split'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_layout = '<section id="cach" class="pane"><div class="split"><div class="panel card"><h3>Cách Cục đã match</h3><div id="cachList"></div></div><div class="panel card"><h3>Cách Cục Phá/Giảm</h3><div id="modList"></div></div></div></section>'
          unified_layout = '<section id="cach" class="pane"><div class="panel card cach-panel"><div class="section-title"><h3>Cách Cục</h3><small>Tất cả Cách Cục được engine xác định</small></div><div id="cachList"></div></div></section>'

          old_unified_layout = '<section id="cach" class="pane"><div class="panel card cach-panel"><div class="section-title"><h3>Cách Cục</h3><small>Toàn bộ Cách Cục và các yếu tố Phá/Giảm hiển thị chung</small></div><div id="cachList"></div></div></section>'

          old_css = '.db,.cach{padding:9px;border:1px solid var(--line);border-radius:9px;background:#09111e}.db h4,.cach h4{margin:0 0 5px}'
          new_css = '.db,.cach{padding:9px;border:1px solid var(--line);border-radius:9px;background:#09111e}.db h4,.cach h4{margin:0 0 5px}.cach-panel #cachList{display:grid;gap:10px;margin-top:10px}.cach-item{padding:11px;border:1px solid var(--line);border-radius:10px;background:#09111e}.cach-item h4{margin:0 0 6px}.cach-evidence{margin-top:7px;color:#c8d3e6;font-size:12px}.cach-list-empty{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}'

          old_render = '''function renderCach(){
  const matched=Array.isArray(chart?.cach_cuc_analysis?.matched)?chart.cach_cuc_analysis.matched:[];
  const locPhungXungPha=matched.find(x=>normalize(x?.name)===normalize('Lộc Phùng Xung Phá'));
  $('cachList').innerHTML=matched.length?matched.map(x=>`<div class="cach"><h4>${esc(x.name)}</h4><div>${esc(x.category||'')}</div><p>${esc(x.description||x.reason||'')}</p></div>`).join(''):'<div class="msg">Chưa có Cách Cục match.</div>';
  $('modList').innerHTML=locPhungXungPha?`<div class="cach"><h4>Lộc Phùng Xung Phá</h4><p>${esc(locPhungXungPha.description||locPhungXungPha.reason||'Cách Cục phá đã được xác định.')}</p></div>`:'<div class="msg">Không có</div>';
}'''

          old_render_unified = '''function renderCach(){
  const analysis=chart?.cach_cuc_analysis||{};
  const matched=Array.isArray(analysis.matched)?analysis.matched:[];
  const modifiers=Array.isArray(analysis.modifiers)?analysis.modifiers:[];
  const items=[];

  matched.forEach(x=>{
    if(!x||typeof x!=='object') return;
    const evidence=Array.isArray(x.matched_branches)?x.matched_branches:[];
    const evidenceText=evidence.length?evidence.map(ev=>{
      const relation=ev?.relation||ev?.relationship||'';
      const palace=ev?.palace?.cung||ev?.palace?.dia_chi||ev?.cung||ev?.dia_chi||'';
      const stars=Array.isArray(ev?.stars)?ev.stars.join(', '):(ev?.star||'');
      return [relation,palace,stars].filter(Boolean).join(' · ');
    }).filter(Boolean).join(' | '):'';
    items.push(`<div class="cach-item core"><h4>${esc(x.name||'Cách Cục')}</h4><div class="cach-meta"><span class="cach-tag">Cách Cục</span>${x.category?`<span class="cach-tag">${esc(x.category)}</span>`:''}</div><p>${esc(x.description||x.reason||'')}</p>${evidenceText?`<div class="cach-evidence"><b>Bằng chứng:</b> ${esc(evidenceText)}</div>`:''}</div>`);
  });

  modifiers.forEach(x=>{
    if(!x||typeof x!=='object') return;
    const evidence=Array.isArray(x.breaking_evidence)?x.breaking_evidence:[];
    const evidenceText=evidence.map(ev=>{
      const relation=ev?.relation||'';
      const palace=ev?.palace?.cung||ev?.palace?.dia_chi||'';
      const star=ev?.star||'';
      return [relation,palace,star].filter(Boolean).join(' · ');
    }).filter(Boolean).join(' | ');
    items.push(`<div class="cach-item modifier"><h4>${esc(x.name||'Modifier Phá/Giảm')}</h4><div class="cach-meta"><span class="cach-tag">Phá/Giảm</span>${x.effect?`<span class="cach-tag">${esc(x.effect)}</span>`:''}</div><p>${esc(x.interpretation||x.ai_instruction||'Đã phát hiện yếu tố làm giảm/phá Cách Cục.')}</p>${evidenceText?`<div class="cach-evidence"><b>Yếu tố tác động:</b> ${esc(evidenceText)}</div>`:''}</div>`);
  });

  $('cachList').innerHTML=items.length?items.join(''):'<div class="cach-list-empty">Chưa có Cách Cục hoặc yếu tố Phá/Giảm được xác định.</div>';
  const mod=$('modList');
  if(mod) mod.innerHTML='';
}'''

          new_render = '''function renderCach(){
  const matched=Array.isArray(chart?.cach_cuc_analysis?.matched)?chart.cach_cuc_analysis.matched:[];
  $('cachList').innerHTML=matched.length?matched.map(x=>{
    if(!x||typeof x!=='object') return '';
    const evidence=Array.isArray(x.matched_branches)?x.matched_branches:[];
    const evidenceText=evidence.map(ev=>{
      const relation=ev?.relation||ev?.relationship||'';
      const palace=ev?.palace?.cung||ev?.palace?.dia_chi||ev?.cung||ev?.dia_chi||'';
      const stars=Array.isArray(ev?.stars)?ev.stars.join(', '):(ev?.star||'');
      return [relation,palace,stars].filter(Boolean).join(' · ');
    }).filter(Boolean).join(' | ');
    return `<div class="cach-item"><h4>${esc(x.name||'Cách Cục')}</h4><p>${esc(x.description||x.reason||'')}</p>${evidenceText?`<div class="cach-evidence"><b>Bằng chứng:</b> ${esc(evidenceText)}</div>`:''}</div>`;
  }).join(''):'<div class="cach-list-empty">Chưa có Cách Cục match.</div>';
}'''

          changed = False
          if old_layout in text:
              text = text.replace(old_layout, unified_layout, 1)
              changed = True
          elif old_unified_layout in text:
              text = text.replace(old_unified_layout, unified_layout, 1)
              changed = True

          if old_css in text and new_css not in text:
              text = text.replace(old_css, new_css, 1)
              changed = True

          if old_render in text:
              text = text.replace(old_render, new_render, 1)
              changed = True
          elif old_render_unified in text:
              text = text.replace(old_render_unified, new_render, 1)
              changed = True

          if not changed:
              print('index.html already uses unified all-Cach-Cuc display')
              raise SystemExit(0)

          p.write_text(text, encoding='utf-8')
          print('index.html all-Cach-Cuc display: PASS')

      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<section id="cach" class="pane"><div class="panel card cach-panel">',
              'id="cachList"',
              'function renderCach(){',
              'cach-item',
          ]
          forbidden = [
              '<h3>Cách Cục Phá/Giảm</h3>',
              'analysis.modifiers',
              'cach-item modifier',
              'Lộc Phùng Xung Phá',
          ]
          missing = [x for x in required if x not in text]
          present_forbidden = [x for x in forbidden if x in text]
          if missing:
              raise SystemExit(f'All Cách Cục verification failed: {missing}')
          if present_forbidden:
              raise SystemExit(f'Forbidden good/bad or modifier display found: {present_forbidden}')
          print('All Cách Cục verification: PASS')

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: display all Cach Cuc without good bad split'
          git push
