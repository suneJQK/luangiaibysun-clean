name: Move Cach Cuc Pha Giam

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/move-cach-pha-giam.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: move-cach-pha-giam
  cancel-in-progress: true

jobs:
  patch:
    if: github.event_name != 'push' || github.event.head_commit.message != 'fix: display all Cach Cuc including Loc Phung Xung Pha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_layout = '<section id="cach" class="pane"><div class="split"><div class="panel card"><h3>Cách Cục đã match</h3><div id="cachList"></div></div><div class="panel card"><h3>Cách Cục Phá/Giảm</h3><div id="modList"></div></div></div></section>'
          new_layout = '<section id="cach" class="pane"><div class="panel card cach-panel"><div class="section-title"><h3>Cách Cục</h3><small>Toàn bộ Cách Cục được engine xác định</small></div><div id="cachList"></div></div></section>'
          old_layout2 = '<section id="cach" class="pane"><div class="panel card cach-panel"><div class="section-title"><h3>Cách Cục</h3><small>Toàn bộ Cách Cục và các yếu tố Phá/Giảm hiển thị chung</small></div><div id="cachList"></div></div></section>'
          if old_layout in text:
              text = text.replace(old_layout, new_layout, 1)
          elif old_layout2 in text:
              text = text.replace(old_layout2, new_layout, 1)
          css_old = '.db,.cach{padding:9px;border:1px solid var(--line);border-radius:9px;background:#09111e}.db h4,.cach h4{margin:0 0 5px}'
          css_new = css_old + '.cach-panel #cachList{display:grid;gap:10px;margin-top:10px}.cach-item{padding:11px;border:1px solid var(--line);border-radius:10px;background:#09111e}.cach-item h4{margin:0 0 6px}.cach-meta{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}.cach-tag{display:inline-flex;align-items:center;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}.cach-evidence{margin-top:7px;color:#c8d3e6;font-size:12px}.cach-list-empty{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}'
          if css_old in text and css_new not in text:
              text = text.replace(css_old, css_new, 1)
          start = text.find('function renderCach(){')
          end = text.find('\n}\nasync function call', start)
          if start < 0 or end < 0:
              raise SystemExit('renderCach function not found')
          new_render = '''function renderCach(){
  const analysis=chart?.cach_cuc_analysis||{};
  const matched=Array.isArray(analysis.matched)?analysis.matched:[];
  const modifiers=Array.isArray(analysis.modifiers)?analysis.modifiers:[];
  const items=[];
  const seen=new Set();
  const addItem=(name,description,category,evidence)=>{
    const key=normalize(name);
    if(!key||seen.has(key)) return;
    seen.add(key);
    const evidenceText=Array.isArray(evidence)?evidence.map(ev=>{
      const relation=ev?.relation||ev?.relationship||'';
      const palace=ev?.palace?.cung||ev?.palace?.dia_chi||ev?.cung||ev?.dia_chi||'';
      const stars=Array.isArray(ev?.stars)?ev.stars.join(', '):(ev?.star||'');
      return [relation,palace,stars].filter(Boolean).join(' · ');
    }).filter(Boolean).join(' | '):'';
    items.push(`<div class="cach-item"><h4>${esc(name)}</h4>${category?`<div class="cach-meta"><span class="cach-tag">${esc(category)}</span></div>`:''}<p>${esc(description||'')}</p>${evidenceText?`<div class="cach-evidence"><b>Bằng chứng:</b> ${esc(evidenceText)}</div>`:''}</div>`);
  };
  matched.forEach(x=>{if(x&&typeof x==='object') addItem(x.name||'Cách Cục',x.description||x.reason||'',x.category||'Cách Cục',x.matched_branches||[]);});
  modifiers.forEach(x=>{if(x&&typeof x==='object') addItem(x.name||'Cách Cục',x.interpretation||x.ai_instruction||'', '', x.breaking_evidence||[]);});
  $('cachList').innerHTML=items.length?items.join(''):'<div class="cach-list-empty">Chưa có Cách Cục được xác định.</div>';
  const mod=$('modList');
  if(mod) mod.innerHTML='';
}'''
          text = text[:start] + new_render + text[end+2:]
          p.write_text(text, encoding='utf-8')
      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
            '<section id="cach" class="pane"><div class="panel card cach-panel">',
            'const modifiers=Array.isArray(analysis.modifiers)?analysis.modifiers:[];',
            "addItem(x.name||'Cách Cục',x.interpretation||x.ai_instruction||'', '', x.breaking_evidence||[]);"
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'Missing: {missing}')
          print('Cách Cục unified verification: PASS')
      - name: Commit patched index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: display all Cach Cuc including Loc Phung Xung Pha'
          git push